name: AI Code Review

on:
  pull_request:
    branches: [master, develop]
    types: [opened, reopened, labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    # Run for new/reopened PRs and when the retry label is added; skip forks (no secrets there).
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' || github.event.label.name == 'ai-cr:review')
    runs-on: ubuntu-latest
    # LLM_PROVIDER_API_KEY is an environment secret, so the job must declare the environment.
    environment: development
    timeout-minutes: 10
    concurrency:
      group: ai-code-review-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: ./.github/actions/ai-code-review
        with:
          openrouter-api-key: ${{ secrets.LLM_PROVIDER_API_KEY }}
          github-token: ${{ github.token }}
          pr-number: ${{ github.event.pull_request.number }}
          pr-title: ${{ github.event.pull_request.title }}
          pr-body: ${{ github.event.pull_request.body }}
